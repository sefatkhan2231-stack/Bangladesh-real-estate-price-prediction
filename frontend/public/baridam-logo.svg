<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="BariDam logo" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="trend" gradientUnits="userSpaceOnUse" x1="140" y1="360" x2="356" y2="236">
      <stop offset="0" stop-color="#0a7a52"/>
      <stop offset="1" stop-color="#19c37d"/>
    </linearGradient>
  </defs>

  <!-- background tile -->
  <rect width="512" height="512" rx="112" fill="#062b22"/>

  <!-- house -->
  <path d="M256 82 L420 214 V410 Q420 430 400 430 H112 Q92 430 92 410 V214 Z"
        fill="#f3f8f5" stroke="#f3f8f5" stroke-width="16" stroke-linejoin="round"/>

  <!-- rising price trend -->
  <polyline points="140,360 210,296 262,332 356,236" fill="none" stroke="url(#trend)"
            stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- red sun (from the flag) as the latest price point -->
  <circle cx="356" cy="236" r="34" fill="#f42a41" stroke="#f3f8f5" stroke-width="10"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
